---
layout: default
---
{% assign cat = page.categories | first %}
<article class="post">
  <a class="back" href="{{ '/posts/' | relative_url }}">← Усі записи</a>
  <header class="post-head">
    <span class="chip">{{ site.categories_meta[cat] | default: "🍯" }} {{ cat | default: "інше" }}</span>
    <h1>{{ page.title }}</h1>
    <p class="meta">{{ page.date | date: "%d.%m.%Y" }}{% if page.author %} · {{ page.author }}{% endif %}</p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
