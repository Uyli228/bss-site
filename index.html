<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>Вулик</title>
  <meta name="description" content="Наш сайт по Bee Swarm Simulator">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=6">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="logo" href="#/"><img src="assets/favicon.svg" alt="" width="28" height="28"><span data-site-title>Вулик</span></a>
      <nav class="nav" data-nav></nav>
    </div>
  </header>

  <main class="wrap main" data-main>
    <p class="loading">Завантаження…</p>
  </main>

  <button class="fab" data-fab title="Редагувати сайт" aria-label="Редагувати сайт">
    <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>
  </button>
  <div class="admin-bar" data-admin-bar hidden>
    <span class="admin-dot"></span>
    <span data-admin-status>Режим редагування</span>
    <button class="btn" data-save>Зберегти</button>
    <button class="btn ghost" data-logout>Вийти</button>
  </div>
  <div class="toast" data-toast hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="assets/app.js?v=6"></script>
</body>
</html>
