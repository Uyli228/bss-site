# Налаштування сайту. Після зміни цього файлу GitHub перебудує сайт за 1-2 хвилини.
title: "Вулик"
description: "Наш спільний довідник по Bee Swarm Simulator: бджоли, поля, таблиці, гайди, скріни й корисні посилання."
lang: uk

# Назва репозиторію на GitHub (з косою рискою спереду). Не чіпай, якщо не перейменовуєш репозиторій.
baseurl: "/bss-site"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

permalink: /posts/:title/
timezone: Europe/Kyiv

# Меню вгорі сайту
nav:
  - { title: "Головна",   url: "/",         icon: "home" }
  - { title: "Бджоли",    url: "/bees/",    icon: "bee" }
  - { title: "Поля",      url: "/fields/",  icon: "flower" }
  - { title: "Записи",    url: "/posts/",   icon: "book" }
  - { title: "Галерея",   url: "/gallery/", icon: "image" }
  - { title: "Посилання", url: "/links/",   icon: "link" }

# Категорії записів: назва -> колір значка
categories_meta:
  таблиці: "#3b8eea"
  гайди: "#2fb36b"
  новини: "#e8483b"
  інше: "#9a6bd8"

exclude:
  - README.md
