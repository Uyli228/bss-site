---
layout: default
title: Записи
permalink: /posts/
---
<div class="page-head">
  <h1>Записи</h1>
  <p>Гайди, таблиці та все, що ми накидали. Новий запис — це файл у папці <code>_posts</code>.</p>
</div>

<div class="toolbar">
  <label class="search">{% include icon.html name="search" %}<input type="search" placeholder="Пошук за назвою чи текстом…" data-search></label>
  <div class="chips" data-filters>
    <button class="chip-btn active" data-cat="all">Усі</button>
    {% for c in site.categories_meta %}
      <button class="chip-btn" data-cat="{{ c[0] }}"><i class="dot" style="background:{{ c[1] }}"></i>{{ c[0] }}</button>
    {% endfor %}
  </div>
</div>

<div class="grid" data-posts>
  {% for post in site.posts %}
    {% include post-card.html post=post %}
  {% endfor %}
</div>
<p class="empty" data-empty hidden>Нічого не знайшлося 🐝</p>
